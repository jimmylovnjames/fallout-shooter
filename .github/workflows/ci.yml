name: CI

# Mirrors tools/ci.sh exactly (lint, IP check, import, GUT, signed APK, lavapipe screenshot + bench).
# Every push uploads the APK as an artifact; phase tags (p0, p1, ...) also publish a Release.
on:
  push:
    branches: ["**"]
    tags: ["p*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_HOME: ${{ github.workspace }}/../godot
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count, versionName = git describe

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Godot + export templates
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/../godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('tools/versions.env') }}

      - name: Toolchain
        run: tools/setup_toolchain.sh --with-render

      - name: CI pipeline
        run: tools/ci.sh

      - name: Job summary
        if: always()
        run: |
          [ -f build/ci-summary.md ] && cat build/ci-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasteland-${{ github.ref_name }}-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/wasteland-debug.apk
            build/ci-summary.md
            build/test-results/
            build/screenshots/
            build/bench-*.json
            build/*.log

      - name: Publish phase release
        if: startsWith(github.ref, 'refs/tags/p')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release_notes.sh "$GITHUB_REF_NAME" > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "build/wasteland-debug.apk#wasteland-${GITHUB_REF_NAME}-debug.apk" \
            build/screenshots/*.png \
            --title "WASTELAND ${GITHUB_REF_NAME} (debug)" \
            --notes-file build/release-notes.md \
            --prerelease
